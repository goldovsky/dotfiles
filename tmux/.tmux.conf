# └──────────────────────────────────────────┘

source ~/.config/tmux/keybindings.tmux
source ~/.config/tmux/settings.tmux
# Machine-local overrides (dev container name, paths...). Not versioned.
if-shell '[ -f ~/.config/tmux/local.tmux ]' 'source ~/.config/tmux/local.tmux'
# Load colors from shared theme
source ~/git/dotfiles/shell/common/themes/outputs/tmux-colors.tmux
source ~/.config/tmux/stylings.tmux
source ~/.config/tmux/plugins.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# to install it, it's a simple git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# <leader>-I to install them first time
